name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.8)'
        required: true
        type: string

env:
  FLUTTER_VERSION: '3.41.7'

jobs:
  # Validate secrets exist
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "⚠️ Warning: ANDROID_KEYSTORE_BASE64 secret not set. Will use debug keystore (builds may fail signature checks)."
          else
            echo "✅ ANDROID_KEYSTORE_BASE64 secret is configured"
          fi
        continue-on-error: true

  # Android Build
  build-android:
    runs-on: ubuntu-latest
    needs: check-secrets
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      
      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 'stable'
      
      - name: Verify Dart SDK Version
        run: |
          DART_VERSION=$(dart --version | grep -oP 'Dart SDK version: \K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "✅ Dart SDK version: $DART_VERSION"
      
      - name: Install dependencies
        run: flutter pub get

      - name: Decode Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "Decoding keystore from base64..."
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/musly-release.keystore
          
          # Create key.properties
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=musly-release.keystore
          EOF
          
          echo "✅ Keystore configured for signing"
      
      - name: Build APKs
        run: |
          echo "Building APKs..."
          flutter build apk --release
      
      - name: Build AppBundle
        run: |
          echo "Building AppBundle..."
          flutter build appbundle --release
      
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  # iOS Build (macOS required)
  build-ios:
    runs-on: macos-latest
    needs: check-secrets
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      
      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 'stable'
      
      - name: Verify Dart SDK Version
        run: |
          DART_VERSION=$(dart --version | grep -oP 'Dart SDK version: \K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "✅ Dart SDK version: $DART_VERSION"
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build iOS (no codesign for testing)
        run: |
          flutter build ios --release --no-codesign
      
      - name: Create IPA
        run: |
          ls -la build/ios/
          cd build/ios/Release-iphoneos
          mkdir -p Payload
          cp -r *.app Payload/
          zip -r ../../../musly-ios.ipa Payload
          cd ../../..
      
      - name: Upload iOS Build
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: musly-ios.ipa
          if-no-files-found: error

  # Windows Build
  build-windows:
    runs-on: windows-latest
    needs: check-secrets
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      
      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 'stable'
      
      - name: Verify Dart SDK Version
        shell: pwsh
        run: |
          $DART_VERSION = (dart --version 2>&1 | Select-String -Pattern 'Dart SDK version: ([0-9]+\.[0-9]+\.[0-9]+)').Matches.Groups[1].Value
          Write-Host "✅ Dart SDK version: $DART_VERSION"
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build Windows
        env:
          CL: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          _CL_: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
        shell: pwsh
        run: |
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) {
            throw "Flutter build windows failed with exit code $LASTEXITCODE"
          }
      
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y

      - name: Build NSIS Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DMUSLY_VERSION="${{ github.event.inputs.version }}" installer.nsi
          if ($LASTEXITCODE -ne 0) {
            throw "NSIS compilation failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path "musly-setup.exe")) {
            throw "NSIS build failed: musly-setup.exe was not created!"
          }
          Write-Host "✅ NSIS installer successfully built: musly-setup.exe"

      - name: Prepare Windows Package
        shell: pwsh
        run: |
          if (-not (Test-Path "musly-setup.exe")) {
            throw "Fatal: musly-setup.exe is missing before packaging!"
          }
          New-Item -ItemType Directory -Force -Path windows_package
          Copy-Item -Path "build\windows\x64\runner\Release\*" -Destination "windows_package\" -Recurse -Force
          Copy-Item -Path "musly-setup.exe" -Destination "windows_package\" -Force

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: windows_package/
          if-no-files-found: error

  # Linux Build
  build-linux:
    runs-on: ubuntu-latest
    needs: check-secrets
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libasound2-dev libnotify-dev libsecret-1-dev libjsoncpp-dev libmpv-dev
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      
      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 'stable'
      
      - name: Verify Dart SDK Version
        run: |
          DART_VERSION=$(dart --version | grep -oP 'Dart SDK version: \K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "✅ Dart SDK version: $DART_VERSION"
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build Linux
        run: |
          flutter build linux --release
      
      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/linux/x64/release/bundle/
          if-no-files-found: error

  # macOS Build
  build-macos:
    runs-on: macos-latest
    needs: check-secrets
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      
      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 'stable'
      
      - name: Verify Dart SDK Version
        run: |
          DART_VERSION=$(dart --version | grep -oP 'Dart SDK version: \K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "✅ Dart SDK version: $DART_VERSION"
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build macOS
        run: |
          flutter build macos --release
      
      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          set -e
          APP_PATH="build/macos/Build/Products/Release/musly.app"
          DMG_NAME="musly-macos.dmg"

          echo "Verifying app exists at $APP_PATH..."
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: App not found at $APP_PATH"
            ls -la build/macos/Build/Products/Release/
            exit 1
          fi

          rm -f "$DMG_NAME"

          echo "Generating DMG installer with drag-and-drop background..."
          create-dmg \
            --volname "Musly" \
            --background "packaging/macos/dmg_background.png" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 120 \
            --icon "musly.app" 180 190 \
            --hide-extension "musly.app" \
            --app-drop-link 480 190 \
            --no-strip \
            "$DMG_NAME" \
            "$APP_PATH" || true

          if [ ! -f "$DMG_NAME" ]; then
            echo "::error::Fatal: create-dmg failed to create $DMG_NAME!"
            exit 1
          fi

          echo "Verifying DMG integrity with hdiutil..."
          hdiutil imageinfo "$DMG_NAME" > /dev/null

          ls -lh "$DMG_NAME"
          echo "✅ DMG created and verified successfully!"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: musly-macos.dmg
          if-no-files-found: error

      - name: Upload macOS Build
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: build/macos/Build/Products/Release/
          if-no-files-found: error

  # Create Release with all artifacts
  release:
    runs-on: ubuntu-latest
    needs: [build-android, build-ios, build-windows, build-linux, build-macos]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ github.event.inputs.version }}" -m "Release v${{ github.event.inputs.version }}"
          git push origin "v${{ github.event.inputs.version }}"

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android/

      - name: Download iOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-build
          path: artifacts/ios/

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: artifacts/windows/

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: artifacts/linux/

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: artifacts/macos/

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts/macos-dmg/

      - name: Package Windows
        run: |
          if [ ! -f "artifacts/windows/musly-setup.exe" ]; then
            echo "::error::Fatal: musly-setup.exe is missing from artifacts/windows! Halting release."
            exit 1
          fi
          cd artifacts/windows
          zip -r ../../musly-windows.zip . -x "musly-setup.exe"
          cd ../..

      - name: Package Linux
        run: |
          cd artifacts/linux
          tar -czf ../../musly-linux-x64.tar.gz .
          cd ../..

      - name: Package macOS
        run: |
          cp artifacts/macos-dmg/*.dmg musly-macos.dmg

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Musly v${{ github.event.inputs.version }}
          body: |
            ## 🎉 Musly v${{ github.event.inputs.version }}

            ### 📦 Downloads

            **Android:**
            - `app-release.apk` (universal APK for all devices)

            **iOS:**
            - `musly-ios.ipa` (sideload with AltStore, Sideloadly, or similar — not signed)

            **Windows:**
            - `musly-setup.exe` (setup installer, run to install Musly)
            - `musly-windows.zip` (portable version, extract and run)

            **macOS:**
            - `musly-macos.dmg` (drag Musly.app to Applications — not notarized)

            **Linux:**
            - `musly-linux-x64.tar.gz` (extract and run musly)

            ### 📝 Changelog
            See [CHANGELOG.md](https://github.com/dddevid/Musly/blob/master/CHANGELOG.md)

            ### 🌍 Translations
            Contribute translations at [Crowdin](https://crowdin.com/project/musly)
          files: |
            artifacts/android/*.apk
            artifacts/ios/*.ipa
            artifacts/windows/musly-setup.exe
            musly-windows.zip
            musly-linux-x64.tar.gz
            musly-macos.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
